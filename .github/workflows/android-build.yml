name: Build Android APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install Android SDK 34
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.7

      - name: Build Debug APK
        working-directory: android
        env:
          PROPELLER_API_URL: ${{ secrets.PROPELLER_API_URL }}
        run: |
          if [ -z "$PROPELLER_API_URL" ]; then
            export PROPELLER_API_URL="https://propellerchallenge.onrender.com/api/v1/"
          fi
          echo "Building with API URL: $PROPELLER_API_URL"
          gradle assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: propeller-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
